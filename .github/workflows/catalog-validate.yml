name: Validate catalog

# Runs on every pull request. This is the required check that gates merging: it
# verifies data/projects.yml is well formed, that README.md is what that data
# renders to, and that each entry the pull request adds meets the rules in
# CONTRIBUTING.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the merged result
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Fetch the data file from the base branch
        id: base
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          # A base branch from before the data file existed cannot say which
          # entries are new, so the stricter per-entry rules are skipped rather
          # than applied to all of them at once.
          if git show "FETCH_HEAD:data/projects.yml" > "${RUNNER_TEMP}/base-projects.yml"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The base branch has no data/projects.yml, so this ran as a full-catalog check."
          fi

      - name: Validate the catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_BASE: ${{ steps.base.outputs.exists }}
          ALLOW_REMOVALS: ${{ contains(github.event.pull_request.labels.*.name, 'entry-removal') }}
        run: |
          args=(check)
          if [ "$HAS_BASE" = "true" ]; then args+=(--base "${RUNNER_TEMP}/base-projects.yml"); fi
          if [ "$ALLOW_REMOVALS" = "true" ]; then args+=(--allow-removals); fi
          python3 scripts/catalog.py "${args[@]}"
